<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur de Vins</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #8B7355 0%, #D4A574 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #F5E6D3;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            color: #5C4033;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #8B7355;
            margin-bottom: 30px;
            font-style: italic;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
            border-left: 5px solid #8B7355;
        }

        label {
            display: block;
            color: #5C4033;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #D4A574;
            border-radius: 8px;
            font-size: 1em;
            margin-bottom: 15px;
            background: #FFFBF7;
            color: #333;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #8B7355;
            box-shadow: 0 0 5px rgba(139, 115, 85, 0.3);
        }

        .price-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .price-box {
            background: #F0E6D2;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .price-box strong {
            color: #5C4033;
            display: block;
            margin-bottom: 8px;
        }

        .price-value {
            color: #8B7355;
            font-size: 1.8em;
            font-weight: bold;
        }

        .buttons-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        .qty-btn {
            padding: 12px;
            border: none;
            background: #D4A574;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.95em;
        }

        .qty-btn:hover {
            background: #8B7355;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .result {
            background: #E8D4B8;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            border: 2px solid #8B7355;
        }

        .result h3 {
            color: #5C4033;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .result-item {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 6px;
        }

        .result-label {
            color: #8B7355;
            font-weight: 600;
            text-align: left;
        }

        .result-value {
            color: #5C4033;
            font-size: 1.4em;
            font-weight: bold;
            text-align: right;
        }

        .total-price {
            font-size: 1.8em !important;
            color: #8B7355 !important;
        }

        .wine-details {
            background: #F0E6D2;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.95em;
            color: #5C4033;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍷 Calculateur de Vins</h1>
        <p class="subtitle">Sylvins - Professionnels</p>

        <div class="card">
            <label for="wine-select">Sélectionnez un vin :</label>
            <select id="wine-select">
                <option value="">-- Choisir un vin --</option>
                <optgroup label="Domaine de Capelude">
                    <option value="capelude-cochon-blanc">Capelude Cuvée Cochon - Blanc 2024 | 9,30€</option>
                    <option value="capelude-cochon-rose">Capelude Cuvée Cochon - Rosé 2024 | 9,30€</option>
                    <option value="capelude-cochon-rouge">Capelude Cuvée Cochon - Rouge 2023 | 9,30€</option>
                    <option value="capelude-colbres">Domaine de Capelude Les Colbres - Blanc 2023 | 13,70€</option>
                    <option value="capelude-messugues">Domaine de Capelude Les Messugues - Rosé 2024 | 12,40€</option>
                    <option value="capelude-schiste">Domaine de Capelude Rouge de Schiste - Rouge 2023 | 13,70€</option>
                    <option value="capelude-tibouren">Capelude Tibouren - Rouge 2024 | 13,70€</option>
                </optgroup>
                <optgroup label="Domaine du Bagnol">
                    <option value="bagnol-tradition">Domaine du Bagnol Cuvée Tradition - Blanc 2025 | 11,67€</option>
                </optgroup>
                <optgroup label="Domaine du Gros' Noré">
                    <option value="gros-nore">Domaine du Gros'Noré - Rouge 2021 | 19,20€</option>
                </optgroup>
                <optgroup label="Domaine La Gayolle">
                    <option value="gayolle-platanes">Les Platanes - 75cl | 4,65€</option>
                    <option value="gayolle-chapelle">La Chapelle - 75cl | 5,70€</option>
                </optgroup>
                <optgroup label="Château Paquette">
                    <option value="paquette-angelico">Château Paquette Angélico & Forum Julli - 2025 | 8,21€</option>
                </optgroup>
                <optgroup label="Domaine La Suffrène">
                    <option value="sufferne-tradition">Domaine La Suffrène Tradition - Rouge 2021 | 13,20€</option>
                </optgroup>
                <optgroup label="Clos Canereccia">
                    <option value="canereccia-blanc">Cuvée des Pierre - Blanc 2025 | 10,40€</option>
                    <option value="canereccia-rose">Cuvée des Pierre - Rosé 2025 | 7,44€</option>
                    <option value="canereccia-rouge">Cuvée des Pierre - Rouge 2024 | 9,10€</option>
                    <option value="clos-blanc">Clos Canereccia - Blanc 2025 | 15,84€</option>
                    <option value="clos-rose">Clos Canereccia - Rosé 2025 | 10,30€</option>
                    <option value="clos-rouge">Clos Canereccia - Rouge 2023 | 15,84€</option>
                </optgroup>
            </select>

            <label for="quantity">Nombre de bouteilles :</label>
            <input type="number" id="quantity" value="0" min="0">

            <div id="prices" class="price-info" style="display:none;">
                <div class="price-box">
                    <strong>Prix/Unité</strong>
                    <div class="price-value" id="unit-price">-</div>
                </div>
                <div class="price-box">
                    <strong>Cartons (6 btl)</strong>
                    <div class="price-value" id="carton-count">0</div>
                </div>
            </div>

            <div class="buttons-group">
                <button class="qty-btn" onclick="setQuantity(36)">36 bouteilles<br>(6 cartons)</button>
                <button class="qty-btn" onclick="setQuantity(60)">60 bouteilles<br>(10 cartons)</button>
                <button class="qty-btn" onclick="setQuantity(120)">120 bouteilles<br>(20 cartons)</button>
            </div>
        </div>

        <div id="result" class="result" style="display:none;">
            <h3>📊 Résumé de votre commande</h3>
            <div class="result-item">
                <div class="result-label">Quantité :</div>
                <div class="result-value"><span id="result-qty">0</span> bouteilles</div>
            </div>
            <div class="result-item">
                <div class="result-label">Cartons :</div>
                <div class="result-value"><span id="result-cartons">0</span> × 6 btl</div>
            </div>
            <div class="result-item">
                <div class="result-label">Prix unitaire :</div>
                <div class="result-value"><span id="result-unit">0</span> €</div>
            </div>
            <div class="result-item" style="border-top: 2px solid #D4A574; padding-top: 15px; margin-top: 15px;">
                <div class="result-label"><strong>PRIX TOTAL :</strong></div>
                <div class="result-value total-price"><span id="result-total">0</span> €</div>
            </div>
            <div id="wine-details" class="wine-details"></div>
        </div>
    </div>

    <script>
        const wines = {
            'capelude-cochon-blanc': { name: 'Capelude Cuvée Cochon - Blanc 2024', prix36: 9.30, prix60: null, prix120: null },
            'capelude-cochon-rose': { name: 'Capelude Cuvée Cochon - Rosé 2024', prix36: 9.30, prix60: null, prix120: null },
            'capelude-cochon-rouge': { name: 'Capelude Cuvée Cochon - Rouge 2023', prix36: 9.30, prix60: null, prix120: null },
            'capelude-colbres': { name: 'Domaine de Capelude Les Colbres - Blanc 2023', prix36: 13.70, prix60: null, prix120: null },
            'capelude-messugues': { name: 'Domaine de Capelude Les Messugues - Rosé 2024', prix36: 12.40, prix60: null, prix120: null },
            'capelude-schiste': { name: 'Domaine de Capelude Rouge de Schiste - Rouge 2023', prix36: 13.70, prix60: null, prix120: null },
            'capelude-tibouren': { name: 'Capelude Tibouren - Rouge 2024', prix36: 13.70, prix60: null, prix120: null },
            'bagnol-tradition': { name: 'Domaine du Bagnol Cuvée Tradition - Blanc 2025', prix36: 11.67, prix60: null, prix120: null },
            'gros-nore': { name: 'Domaine du Gros\'Noré - Rouge 2021', prix36: 19.20, prix60: 18.20, prix120: 17.70 },
            'gayolle-platanes': { name: 'Les Platanes - 75cl', prix36: 4.65, prix60: 4.55, prix120: 4.35 },
            'gayolle-chapelle': { name: 'La Chapelle - 75cl', prix36: 5.70, prix60: 5.55, prix120: 5.30 },
            'paquette-angelico': { name: 'Château Paquette Angélico & Forum Julli - 2025', prix36: 8.21, prix60: 7.90, prix120: 7.62 },
            'sufferne-tradition': { name: 'Domaine La Suffrène Tradition - Rouge 2021', prix36: 13.20, prix60: null, prix120: null },
            'canereccia-blanc': { name: 'Cuvée des Pierre - Blanc 2025', prix36: 10.40, prix60: null, prix120: null },
            'canereccia-rose': { name: 'Cuvée des Pierre - Rosé 2025', prix36: 7.44, prix60: null, prix120: null },
            'canereccia-rouge': { name: 'Cuvée des Pierre - Rouge 2024', prix36: 9.10, prix60: null, prix120: null },
            'clos-blanc': { name: 'Clos Canereccia - Blanc 2025', prix36: 15.84, prix60: null, prix120: null },
            'clos-rose': { name: 'Clos Canereccia - Rosé 2025', prix36: 10.30, prix60: null, prix120: null },
            'clos-rouge': { name: 'Clos Canereccia - Rouge 2023', prix36: 15.84, prix60: null, prix120: null }
        };

        function getPrixByQuantity(wine, qty) {
            if (qty <= 36 || !wine.prix60) return wine.prix36;
            if (qty <= 60 || !wine.prix120) return wine.prix60;
            return wine.prix120;
        }

        function calculate() {
            const wineSelect = document.getElementById('wine-select');
            const quantity = parseInt(document.getElementById('quantity').value) || 0;
            const resultDiv = document.getElementById('result');
            const pricesDiv = document.getElementById('prices');

            if (!wineSelect.value || quantity === 0) {
                resultDiv.style.display = 'none';
                pricesDiv.style.display = 'none';
                return;
            }

            const wine = wines[wineSelect.value];
            const prix = getPrixByQuantity(wine, quantity);
            const cartons = Math.ceil(quantity / 6);
            const total = (prix * quantity).toFixed(2);

            document.getElementById('unit-price').textContent = prix.toFixed(2) + ' €';
            document.getElementById('carton-count').textContent = cartons;
            document.getElementById('result-qty').textContent = quantity;
            document.getElementById('result-cartons').textContent = cartons;
            document.getElementById('result-unit').textContent = prix.toFixed(2);
            document.getElementById('result-total').textContent = parseFloat(total).toLocaleString('fr-FR');
            document.getElementById('wine-details').innerHTML = `<strong>${wine.name}</strong>`;

            pricesDiv.style.display = 'grid';
            resultDiv.style.display = 'block';
        }

        function setQuantity(qty) {
            document.getElementById('quantity').value = qty;
            calculate();
        }

        document.getElementById('wine-select').addEventListener('change', calculate);
        document.getElementById('quantity').addEventListener('input', calculate);
    </script>
</body>
</html>
